<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ruang Rapat HO · Misi 6 · Training Jr. Manager Takaki</title>
<style>
:root{--cream:#FBF6EC;--navy:#1B2A41;--red:#C8102E;--gold:#E8A317;--green:#2E8B57;--blue:#3AA6D8;--grey:#8A939F;--ink:#22303f;--soft:#F3ECDD}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0f1826;font-family:"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:960px;height:min(100vh,600px);height:min(100dvh,600px);max-height:600px;background:var(--cream);display:flex;flex-direction:column;overflow:hidden;border-radius:0;position:relative}
@media(min-width:700px){#app{border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}}
#hd{flex:none;height:46px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px}
#hd img{width:30px;height:30px;border-radius:7px;background:#fff;padding:2px}
#hd .tt{font-weight:800;font-size:clamp(12px,2.4vw,15px);letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:rgba(255,255,255,.16);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.g{background:var(--gold);color:var(--navy)}
#bgm{border:0;border-radius:20px;background:var(--gold);color:var(--navy);font-weight:800;font-size:12px;padding:6px 10px;cursor:pointer;min-height:30px}
#bgm.off{background:#556;color:#fff}
#bar{flex:none;height:5px;background:#d9d4c9}#bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
#mn{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#ft{flex:none;height:22px;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#6b7788;background:var(--soft);letter-spacing:.02em}
h1{font-size:clamp(20px,4.6vw,30px);color:var(--navy);font-weight:800;line-height:1.1}
h2{font-size:clamp(15px,3.2vw,19px);color:var(--navy);font-weight:800;line-height:1.2}
p{font-size:clamp(12.5px,2.5vw,14.5px);line-height:1.4}
.k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1f7fae}
.btn{border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-weight:800;font-size:clamp(13px,2.6vw,15px);padding:11px 16px;cursor:pointer;min-height:44px;transition:transform .08s}
.btn:active{transform:scale(.97)}.btn.gold{background:var(--gold);color:var(--navy)}.btn.gr{background:var(--green)}.btn.rd{background:var(--red)}.btn.bl{background:var(--blue)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 2px 0 rgba(27,42,65,.07),0 6px 14px rgba(27,42,65,.08)}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.start{display:flex;gap:14px;align-items:center}
.start .cast{display:flex;align-items:flex-end;gap:0;flex:none}.start .cast img{height:clamp(90px,22vh,150px)}
@media(max-width:560px){.start{flex-direction:column;text-align:center}.start .cast{justify-content:center}}
input.nm{width:100%;font:inherit;font-weight:700;font-size:16px;border:3px solid var(--navy);border-radius:14px;padding:10px 12px;background:#fff;color:var(--navy);outline:none}
input.nm:focus{border-color:var(--blue)}
.hint{font-size:12px;color:#5b6b7e;min-height:16px}.hint b{color:var(--green)}.hint.er{color:var(--red);font-weight:700}
.pz{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media(max-width:620px){.pz{grid-template-columns:repeat(3,1fr)}}
.slot{background:#e9e3d3;border:3px dashed #b9b3a5;border-radius:12px;min-height:54px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8a8372;font-size:13px;text-align:center;padding:4px;line-height:1.15}
.slot.f{background:#DFF1E6;border:3px solid var(--green);color:var(--navy);animation:pop .25s}
.pc{background:#fff;border:3px solid var(--navy);border-radius:14px;padding:9px 10px;font-weight:800;font-size:clamp(12px,2.4vw,14px);color:var(--navy);cursor:pointer;text-align:left;font-family:inherit;min-height:52px;line-height:1.2}
.pc small{display:block;font-weight:600;font-size:11px;color:#5b6b7e;margin-top:2px}
.pc.used{opacity:.25;pointer-events:none}.pc.bad{animation:shake .35s;border-color:var(--red);background:#FBE3E6}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.sc{font-size:clamp(14px,3vw,17px);line-height:1.4;font-weight:600;color:var(--navy)}
.opt{display:block;width:100%;text-align:left;border:3px solid #d9d4c9;background:#fff;border-radius:14px;padding:9px 12px;font:inherit;font-weight:600;font-size:clamp(12.5px,2.5vw,14.5px);color:var(--ink);cursor:pointer;min-height:44px;line-height:1.3}
.opt:active{transform:scale(.99)}.opt.ok{border-color:var(--green);background:#DFF1E6}.opt.no{border-color:var(--red);background:#FBE3E6}.opt[disabled]{cursor:default}
.fb{border-left:7px solid var(--gold);background:#FFF3D1;border-radius:0 14px 14px 0;padding:9px 12px;font-size:clamp(12.5px,2.5vw,14px);line-height:1.4;color:var(--navy);font-weight:600}
.fb.ok{border-color:var(--green);background:#DFF1E6}.fb.no{border-color:var(--red);background:#FBE3E6}
.rc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rc button{border:0;border-radius:14px;color:#fff;font:inherit;font-weight:800;min-height:54px;font-size:20px;cursor:pointer;line-height:1.1}
.rc button small{display:block;font-size:10.5px;font-weight:700;opacity:.95}
.rc .R{background:var(--blue)}.rc .A{background:var(--red)}.rc .C{background:var(--gold);color:var(--navy)}.rc .I{background:var(--grey)}
.rc button[disabled]{opacity:.35}.rc button.pick{opacity:1;outline:4px solid var(--navy)}
.badge{width:150px;height:150px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--navy);font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 0 0 8px rgba(255,255,255,.35);animation:pop .5s}
.badge b{font-size:40px;line-height:1}.badge span{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}@media(max-width:520px){.sum{grid-template-columns:1fr 1fr}}
.sum div{background:#fff;border-radius:12px;padding:6px 8px;text-align:center;font-size:11px;font-weight:700;color:#5b6b7e}.sum b{display:block;font-size:18px;color:var(--navy)}
.center{text-align:center}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.cg button{border:0;border-radius:14px;color:#fff;font:inherit;font-weight:800;min-height:48px;font-size:clamp(12px,2.4vw,14px);cursor:pointer;font-style:italic}
.cg button:nth-child(1){background:var(--blue)}.cg button:nth-child(2){background:var(--red)}.cg button:nth-child(3){background:var(--gold);color:var(--navy)}.cg button:nth-child(4){background:var(--green)}.cg button:nth-child(5){background:var(--grey)}
.cg button[disabled]{opacity:.35}.cg button.pick{opacity:1;outline:4px solid var(--navy)}
</style>
</head>

/* Ronde 1: jawaban dulu atau terkubur */
function r1(){
 var q=shuffle(R1.map(function(_,i){return i;})),i=0,ok=0;
 function show(){
  setHd('Ronde 1/4',5+(i/4)*20);var it=R1[q[i]];
  h('<div><div class="k">Ronde 1 · Kalimat pembuka · '+(i+1)+'/4</div><h2>Halo, '+firstName(S.name)+'! Pembuka ini mulai dari jawaban atau terkubur?</h2></div>'+
  '<div class="card sc">'+it[0]+'</div><div class="grid2"><button class="btn gr" id="bF">✅ Jawaban dulu</button><button class="btn rd" id="bD">📚 Terkubur</button></div><div id="fx"></div>');
  function ans(v){var good=(v===it[1]);if(good){ok++;S.score+=W.r1/4;}sfx(good?'ok':'no');$('#bF').disabled=$('#bD').disabled=true;
   $('#fx').innerHTML='<div class="fb '+(good?'ok':'no')+'"><b>'+(good?'Benar. ':'Kurang tepat. ')+'</b>'+it[2]+'</div>'+nextBtn(i<3?'Lanjut':'Ke Ronde 2');
   $('#pt').textContent=Math.round(S.score)+' poin';mn.scrollTop=mn.scrollHeight;
   $('#nx').onclick=function(){i++;if(i<4)show();else{S.ok1=ok;S.part.r1=ok*W.r1/4;r2();}};}
  $('#bF').onclick=function(){ans(1)};$('#bD').onclick=function(){ans(0)};
 }
 show();

 order.forEach(function(k){$('#c'+k).onclick=function(){var b=this;
  if(k===next){var s=$('#s'+next);s.className='slot f';s.innerHTML=R3[k][1];b.className='pc used';sfx('ok');next++;
   if(next===6){S.part.r3=Math.max(4,W.r3-4*mist);S.score+=S.part.r3;setHd('Ronde 3/4',75);$('#fb').className='fb ok';$('#fb').innerHTML='Laporan lengkap: kesimpulan di awal, satu grafik, tiga angka, permintaan jelas, rincian di lampiran.';
    var bt=document.createElement('button');bt.className='btn gold';bt.textContent='Masuk Ruang Rapat HO';bt.onclick=r4;mn.appendChild(bt);mn.scrollTop=mn.scrollHeight;}
   else{$('#fb').className='fb';$('#fb').textContent='Tepat. Lanjut ke blok berikutnya.';}}
  else{mist++;sfx('no');b.classList.add('bad');setTimeout(function(){b.classList.remove('bad');},400);$('#fb').className='fb no';$('#fb').textContent='Belum giliran itu. Kesimpulan di puncak, rincian paling akhir.';}
 };});
}

/* Ronde 4: ruang rapat HO */
function r4(){
 var i=0,ok=0,per=W.r4/3;
 function show(){
  setHd('Ronde 4/4',75+(i/3)*25);var it=R4[i];
  var body='<div style="display:flex;flex-direction:column;gap:8px">'+it[1].map(function(t,k){return '<button class="opt" data-k="'+k+'">'+t+'</button>';}).join('')+'</div>';
  h('<div><div class="k">Ronde 4 · Ruang Rapat HO · '+(i+1)+'/3</div><h2>Pilih yang paling tepat</h2></div><div class="card sc">'+it[0]+'</div>'+body+'<div id="fx"></div>');
  var bs=mn.querySelectorAll('button[data-k]');
  bs.forEach(function(b){b.onclick=function(){bs.forEach(function(x){x.disabled=true;});var k=+b.dataset.k,good=(k===it[2]);
   b.classList.add(good?'ok':'no');if(!good)bs[it[2]].classList.add('ok');
   if(good){ok++;S.score+=per;}sfx(good?'ok':'no');
   $('#fx').innerHTML='<div class="fb '+(good?'ok':'no')+'"><b>'+(good?'Benar. ':'Kurang tepat. ')+'</b>'+it[3]+'</div>'+nextBtn(i<2?'Lanjut':'Lihat hasil');
   $('#pt').textContent=Math.round(S.score)+' poin';mn.scrollTop=mn.scrollHeight;
   $('#nx').onclick=function(){i++;if(i<3)show();else{S.ok4=ok;S.part.r4=ok*per;result();}};};});
 }
 show();
}

function result(){
 var sc=Math.round(S.score);setHd('Selesai',100);$('#pt').textContent=sc+' poin';
 var b=sc>=85?['Emas','#E8A317','Lencana Eksekutif Emas']:sc>=70?['Perak','#B8C2CC','Lencana Eksekutif Perak']:['Perunggu','#CD8B54','Lencana Eksekutif Perunggu'];
 var msg=sc>=85?'Luar biasa. Kamu siap membawa laporan dan angka ke ruang rapat.':sc>=70?'Bagus. Sedikit lagi Emas. Buka infografis halaman 3 sampai 7 untuk memantapkan.':'Ayo ulangi. Buka infografis Misi 6 (piramida, lembar hitung, kartu Excel, skrip bicara), lalu coba lagi.';
 sfx('win');signal();
 h('<div class="center"><div class="badge" style="background:radial-gradient(circle at 35% 30%,#fff7 0,'+b[1]+' 55%)"><b>'+sc+'</b><span>'+b[0]+'</span></div></div>'+
 '<div class="center"><h2>'+b[2]+' untuk '+S.name+'</h2><p style="margin-top:4px">'+msg+'</p></div>'+
 '<div class="sum"><div><b>'+S.ok1+'/4</b>Kalimat pembuka</div><div><b>'+S.ok2+'/3</b>Alat Excel</div><div><b>'+Math.round(S.part.r3)+'/20</b>Template laporan</div><div><b>'+S.ok4+'/3</b>Ruang Rapat HO</div></div>'+
 '<div class="row wrap" style="justify-content:center"><button class="btn gold" id="again">Main lagi</button></div>'+
 '<p class="hint center">Langkah berikutnya: kerjakan Post-Test Misi 6.</p>');
 $('#again').onclick=start;
}
start();
})();
</script>
